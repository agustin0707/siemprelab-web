# Actualiza los precios de los vuelos de la prep cada 4 horas.
# El minuto 23 es a propósito: GitHub atrasa o se salta muchas tareas programadas a la hora en punto.
# Si faltan varios precios la corrida queda en rojo y GitHub manda un correo.
name: precios de vuelos

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # primp fijo: las versiones nuevas ya no traen el modo "chrome_126" que usa fast-flights
      - run: pip install fast-flights==2.2 primp==0.15.0 protobuf==6.33.6 selectolax==1.0.2 typing_extensions
      - id: precios
        run: python .github/precios/actualizar.py
        continue-on-error: true
      - name: Guardar si cambió
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add agencia/prep/precios.json
          if ! git diff --cached --quiet; then
            git commit -m "Precios de vuelos al día"
            git pull --rebase origin main && git push
          fi
      - name: Avisar si faltaron precios
        if: steps.precios.outcome == 'failure'
        run: exit 1
